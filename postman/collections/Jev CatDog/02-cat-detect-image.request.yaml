$kind: http-request
name: 2. noul with an image (cat-detect-image)
description: Probability that there is a cat in the photo.
order: 2000
url: '{{base_url}}/systemone'
method: POST
examples: ./.resources/02-cat-detect-image.resources/examples/
headers:
  - key: TypeSafe-Danger-Zone-Images
    value: 'true'
    description: Required to send images; without it TypeSafe responds 400.
body:
  type: formdata
  content:
    - key: request
      type: text
      contentType: application/json
      value: |-
        {
          "model": "{{model}}",
          "state": {"photo": "photo"},
          "assets": {"photo": {"type": "image", "part": "photo"}},
          "questions": {
            "is_cat": {"type": "noul", "instructions": "Is there a cat in `photo`?"}
          }
        }
    - key: photo
      type: file
      src: data/cats/cats_01.jpg
      contentType: image/jpeg
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('noul is between 0 and 1', () => {
        pm.expect(pm.response.json().answers.is_cat.noul).to.be.within(0, 1);
      });
